{% if movement == None %}<span class="text-muted" aria-label="New entry">NEW</span>{% elif movement > 0 %}<span class="up" aria-label="Up {{ movement }} places">↑{{ movement }}</span>{% elif movement < 0 %}<span class="down" aria-label="Down {{ movement|stringformat:'d'|slice:'1:' }} places">↓{{ movement|stringformat:'d'|slice:'1:' }}</span>{% else %}<span class="text-muted" aria-label="No change">—</span>{% endif %}
