[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="merit-football-rankings"
version="0.1.0"
requires-python=">=3.12"
dependencies=["Django>=6.0,<6.1","psycopg[binary]>=3.2","django-redis>=5.4","redis>=5","httpx>=0.27","python-dotenv>=1","Markdown>=3.7,<4","beautifulsoup4>=4.12,<5","lxml>=5,<6","gunicorn>=23; platform_system != 'Windows'"]
[project.optional-dependencies]
dev=["pytest>=8","pytest-django>=4.9","pytest-cov>=5","ruff>=0.9","factory-boy>=3.3","freezegun>=1.5"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE="config.settings.dev"
python_files=["test_*.py"]
[tool.ruff]
line-length=140
target-version="py312"
[tool.ruff.lint]
select=["E4","E9","F"]
[tool.setuptools.packages.find]
include=["apps*","config*"]
